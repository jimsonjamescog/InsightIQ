[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insightiq"
version = "0.3.0"
description = "Autonomous, evidence-grounded business investigation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "networkx>=3.2,<4",
  "openai>=1.68,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
snowflake = [
  "snowflake-connector-python>=3.12,<5",
]
real-data = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
]
dev = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
insightiq-data = "insightiq.data.cli:main"
insightiq-snowflake-load = "insightiq.data.snowflake_loader:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insightiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
